<canvas #canvas [width]="canvasSize()" [height]="canvasSize()" class="cubic-bezier-control__canvas"></canvas>

<div
  class="cubic-bezier-control__point"
  cdkDrag
  cdkDragBoundary=".cubic-bezier-control"
  [cdkDragDisabled]="disabled()"
  (cdkDragMoved)="updateParam('p1')"
  #p1
>
  <button
    [matTooltip]="params() | cubicBezierParams: 'p1'"
    matTooltipPosition="left"
    [cubicBezierControlRipple]="!disabled()"
    (cubicBezierControlDirection)="moveParams('p1', $event)"
  >
    p1
  </button>
</div>

<div
  class="cubic-bezier-control__point"
  cdkDrag
  cdkDragBoundary=".cubic-bezier-control"
  [cdkDragDisabled]="disabled()"
  (cdkDragMoved)="updateParam('p2')"
  #p2
>
  <button
    [matTooltip]="params() | cubicBezierParams: 'p2'"
    matTooltipPosition="right"
    [cubicBezierControlRipple]="!disabled()"
    (cubicBezierControlDirection)="moveParams('p2', $event)"
  >
    p2
  </button>
</div>

<cubic-bezier-control-colors
  [cssVarConfig]="cssVarConfig"
  [refreshOn]="refreshColorsOn()"
  (colorMapChange)="colorMap.set($event)"
/>
